# Leader key: Option+Space (M-Space)
# M-Space opens the which-key popup menu — configured in ~/.tmux/plugins/tmux-which-key/config.yaml
# C-b is kept as a hidden backup prefix (rarely needed)
set-option -g prefix C-b

unbind r
bind r source-file ~/.tmux.conf

set -g mouse on

# Highlight active pane: dim inactive panes so active one stands out
set -g window-style 'bg=colour236'
set -g window-active-style 'bg=terminal'
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=green

# act like vim
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# which-key: config lives at ~/.tmux/plugins/tmux-which-key/config.yaml
# (XDG disabled — macOS realpath doesn't support --relative-to flag)

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'alexwforsythe/tmux-which-key'
# tmux-resurrect: saves and restores sessions across reboots
# tmux-continuum: auto-saves every 10 minutes
# Auto-restore is OFF intentionally — after a reboot, manually restore with: M-Space → R → r
# To manually save at any time: M-Space → R → s
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '10'
set -g @plugin 'dracula/tmux'

set -g @dracula-show-powerline true
set -g @dracula-fixed-location "NYC"
set -g @dracula-plugins "weather"
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g @dracula-left-icon-padding 1
set -g status-left-length 30
set -g status-position top

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
